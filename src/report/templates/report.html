<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ENGAGEMENT_ID}} — Security Assessment Report</title>
  <style>
    :root {
      --color-critical: #dc2626;
      --color-high: #ea580c;
      --color-medium: #d97706;
      --color-low: #16a34a;
      --color-info: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      color: #1f2937;
      background: #f9fafb;
    }
    header {
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
      color: white;
      padding: 40px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    h1 { margin: 0 0 10px; font-size: 2em; }
    .subtitle { opacity: 0.8; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .meta-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid var(--color-info);
    }
    .meta-card label {
      display: block;
      font-size: 0.875em;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }
    .meta-card value {
      font-size: 1.1em;
      font-weight: 600;
    }
    .risk-score {
      font-size: 3em;
      font-weight: 700;
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 8px;
      margin: 20px 0;
    }
    .severity-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .severity-card {
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .severity-card.critical { background: #fee2e2; border: 2px solid var(--color-critical); }
    .severity-card.high { background: #ffedd5; border: 2px solid var(--color-high); }
    .severity-card.medium { background: #fef3c7; border: 2px solid var(--color-medium); }
    .severity-card.low { background: #d1fae5; border: 2px solid var(--color-low); }
    .severity-card .count { font-size: 2em; font-weight: 700; }
    .severity-card .label { font-size: 0.875em; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f3f4f6; font-weight: 600; }
    .finding {
      background: white;
      margin: 20px 0;
      padding: 25px;
      border-radius: 8px;
      border-left: 4px solid var(--color-info);
    }
    .finding.critical { border-left-color: var(--color-critical); }
    .finding.high { border-left-color: var(--color-high); }
    .finding.medium { border-left-color: var(--color-medium); }
    .finding.low { border-left-color: var(--color-low); }
    .finding-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .finding-id { font-family: monospace; background: #f3f4f6; padding: 4px 8px; border-radius: 4px; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.critical { background: #fee2e2; color: var(--color-critical); }
    .badge.high { background: #ffedd5; color: var(--color-high); }
    .badge.medium { background: #fef3c7; color: var(--color-medium); }
    .badge.low { background: #d1fae5; color: var(--color-low); }
    .cvss-score { font-family: monospace; font-size: 1.2em; font-weight: 600; }
    .remediation { background: #f0fdf4; padding: 15px; border-radius: 6px; margin-top: 15px; }
    footer { text-align: center; margin-top: 40px; padding: 20px; color: #6b7280; }
    @media print {
      body { background: white; }
      header { background: #1f2937; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <!-- Template used by reporter.js -->
</body>
</html>
